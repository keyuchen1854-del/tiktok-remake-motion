<div id="video-delivery-preview">
  <video aria-label="视频预览" controls playsinline preload="metadata"
    style="display:block; max-width:100%; max-height:512px; height:auto"></video>
  <button class="btn" type="button">播放视频</button>
  <p role="alert" hidden>预览加载失败，请使用消息中的成片链接。</p>
  <template>__VIDEO_PAYLOAD__</template>
</div>
<script>
(() => {
  const root = document.getElementById("video-delivery-preview");
  const video = root.querySelector("video");
  const play = root.querySelector("button");
  const error = root.querySelector("[role=alert]");
  const encoded = root.querySelector("template").content.textContent.trim();
  const showError = () => { error.hidden = false; };
  video.addEventListener("error", showError);
  video.addEventListener("play", () => { play.hidden = true; });
  play.addEventListener("click", () => video.play().catch(showError));
  const bytes = Uint8Array.from(atob(encoded), character => character.charCodeAt(0));
  video.src = URL.createObjectURL(new Blob([bytes], {type: "video/webm"}));
})();
</script>
